name: OKF approve
description: Mark draft OKF documents stable when their pull request is merged, recording who is responsible. Never blocks a merge.
author: Dzango
branding:
  color: green
  icon: check-circle

inputs:
  config:
    default: .github/okf-approve.yml
    description: Path to the rules file. Without one, the default rules apply.
  keep-status-label:
    default: "okf: keep-status"
    description: A pull request label that leaves its documents as they are, with nobody recorded.
  token:
    default: ${{ github.token }}
    description: Token for the GitHub API and the push. To match teams in reviewers, it must be able to read the organization's teams.

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.merged && github.event.pull_request.base.ref || github.event.pull_request.head.sha }}
        token: ${{ inputs.token }}

    - name: Apply the rules
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        GH_TOKEN: ${{ inputs.token }}
        KEEP_STATUS_LABEL: ${{ inputs.keep-status-label }}
      run: python3 "$GITHUB_ACTION_PATH/okf_approve.py"

    - name: Commit and push
      if: github.event.pull_request.merged
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
      run: |
        git add -A
        if git diff --cached --quiet; then exit 0; fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "docs: record the approval of OKF documents merged in #$PR"
        git push
